services:
  # FastAPI Application
  api:
    build: .
    container_name: health_management_api
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - health_network
    restart: unless-stopped

networks:
  health_network:
    driver: bridge
