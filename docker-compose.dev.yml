services:
  # Base image with dependencies
  base-image:
    build:
      context: .
      dockerfile: Dockerfile.base
      target: base
    image: health-management-base:latest
    command: ["/bin/sh", "-c", "sleep infinity"]

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - health-network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        BASE_IMAGE: health-management-base:latest
    depends_on:
      - base-image
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./app:/home/appuser/app/app # Hot reload for development
      - ./scripts/migrations:/home/appuser/app/migrations

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - health-network

volumes:
  redis_data:
    driver: local

networks:
  health-network:
    driver: bridge
